name: Crypto Price Bot

on:
  schedule:
    - cron: '0 * * * *'  # هر 1 ساعت (رأس هر ساعت)
  workflow_dispatch:      # امکان اجرای دستی
  push:                   # ✨ تریگر push - هر بار که commit/push کنید
    branches:
      - main

jobs:
  send_prices:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write    # ✅ دسترسی نوشتن به مخزن
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # ✅ برای جلوگیری از خطاهای git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (creates prices.txt)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py

      - name: Commit and push prices.txt
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # بررسی اینکه فایل وجود داره
          if [ -f "prices.txt" ]; then
            git add prices.txt
            git commit -m "📊 Update prices - $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
            git push
          else
            echo "⚠️ فایل prices.txt وجود ندارد!"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
